
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>UTEQGram</title>

  <!-- Configuración PWA -->
  <link rel="manifest" href="/manifest.json">

  <meta name="theme-color" content="#4054b2">

  <meta name="mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/png"
        href="/icons/icon-192.png">

  <!-- Fuentes -->
  <link
    href="https://fonts.googleapis.com/css?family=Roboto:400,700"
    rel="stylesheet">

  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet">

  <!-- Material Design Lite -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">

  <!-- Estilos -->
  <link rel="stylesheet" href="/src/css/app.css">
  <link rel="stylesheet" href="/src/css/feed.css">

</head>

<body>

<div id="app">

  <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">

    <!-- HEADER -->
    <header class="mdl-layout__header">

      <div class="mdl-layout__header-row">

        <span class="mdl-layout-title">UTEQGram</span>

        <div class="mdl-layout-spacer"></div>

        <nav class="mdl-navigation mdl-layout--large-screen-only">

          <a class="mdl-navigation__link" href="/">
            Feed
          </a>

          <a class="mdl-navigation__link" href="/help">
            Help
          </a>

          <div class="drawer-option">

            <button
              type="button"
              class="enable-notifications mdl-button mdl-js-button mdl-button--raised mdl-button--colored mdl-color--accent">

              Habilitar Notificaciones

            </button>

          </div>

        </nav>

      </div>

    </header>

    <!-- MENÚ LATERAL -->
    <div class="mdl-layout__drawer">

      <span class="mdl-layout-title">UTEQGram</span>

      <nav class="mdl-navigation">

        <a class="mdl-navigation__link" href="/">
          Feed
        </a>

        <a class="mdl-navigation__link" href="/help">
          Help
        </a>

        <div class="drawer-option">

          <button
            type="button"
            class="enable-notifications mdl-button mdl-js-button mdl-button--raised mdl-button--colored mdl-color--accent">

            Habilitar Notificaciones

          </button>

        </div>

      </nav>

    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="mdl-layout__content mat-typography">

      <!-- FORMULARIO DE PUBLICACIONES -->
      <div id="create-post">

        <form>

          <h5 class="create-post-title">
            Nueva publicación
          </h5>

          <!-- TÍTULO -->
          <div
            class="input-section mdl-textfield mdl-js-textfield mdl-textfield--floating-label">

            <input
              class="mdl-textfield__input"
              type="text"
              id="title"
              maxlength="100"
              required>

            <label
              class="mdl-textfield__label"
              for="title">

              Title

            </label>

          </div>

          <!-- UBICACIÓN -->
          <div
            class="input-section mdl-textfield mdl-js-textfield mdl-textfield--floating-label"
            id="manual-location">

            <input
              class="mdl-textfield__input"
              type="text"
              id="location"
              maxlength="100"
              required>

            <label
              class="mdl-textfield__label"
              for="location">

              Location

            </label>

          </div>

          <!-- CÁMARA DEL CELULAR -->
          <div class="camera-section">

            <p class="camera-section-title">
              Fotografía de la publicación
            </p>

            <label
              for="post-image"
              class="camera-button mdl-button mdl-js-button mdl-button--raised mdl-button--colored mdl-color--accent">

              <i class="material-icons">
                photo_camera
              </i>

              Tomar fotografía

            </label>

            <input
              type="file"
              id="post-image"
              name="post-image"
              accept="image/*"
              capture="environment"
              aria-label="Tomar fotografía para la publicación">

            <!-- VISTA PREVIA -->
            <div
              id="image-preview-container"
              hidden>

              <img
                id="image-preview"
                alt="Vista previa de la fotografía seleccionada">

              <p class="image-preview-text">
                Fotografía seleccionada
              </p>

              <button
                type="button"
                id="remove-image-btn"
                class="mdl-button mdl-js-button mdl-button--accent">

                <i class="material-icons">
                  delete_outline
                </i>

                Quitar fotografía

              </button>

            </div>

          </div>

          <!-- BOTÓN DE PUBLICAR -->
          <div class="post-actions">

            <button
              class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored mdl-color--accent"
              type="submit"
              id="post-btn">

              Postear!

            </button>

          </div>

          <!-- CERRAR FORMULARIO -->
          <div class="close-post-section">

            <button
              class="mdl-button mdl-js-button mdl-button--fab"
              id="close-create-post-modal-btn"
              type="button"
              aria-label="Cerrar formulario">

              <i class="material-icons">
                close
              </i>

            </button>

          </div>

        </form>

      </div>

      <!-- IMAGEN PRINCIPAL -->
      <img
        src="/src/images/main-image.jpg"
        alt="UTEQGram"
        class="main-image">

      <!-- PUBLICACIONES -->
      <div class="page-content">

        <h5 class="text-center mdl-color-text--primary">
          Comparte tus Momentos
        </h5>

        <div id="shared-moments"></div>

      </div>

      <!-- BOTÓN FLOTANTE -->
      <div class="floating-button">

        <button
          type="button"
          class="mdl-button mdl-js-button mdl-button--fab mdl-button--colored"
          id="share-image-button"
          aria-label="Crear publicación">

          <i class="material-icons">
            add
          </i>

        </button>

      </div>

      <!-- MENSAJES -->
      <div
        id="confirmation-toast"
        aria-live="assertive"
        aria-atomic="true"
        aria-relevant="text"
        class="mdl-snackbar mdl-js-snackbar">

        <div class="mdl-snackbar__text"></div>

        <button
          type="button"
          class="mdl-snackbar__action">
        </button>

      </div>

    </main>

  </div>

</div>

<!-- MATERIAL DESIGN LITE -->
<script defer
        src="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.min.js">
</script>


<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-storage-compat.js"></script>

<!-- CONFIGURACION FIREBASE -->
<script src="/src/js/firebase-config.js"></script>

<!-- JAVASCRIPT UTEQGRAM -->
<script src="/src/js/idb.js"></script>
<script src="/src/js/utility.js"></script>
<script src="/src/js/app.js"></script>
<script src="/src/js/feed.js?v=camara-android-02"></script>


</body>
</html>
